version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    # Group minor/patch updates to reduce PR noise
    groups:
      # vitest and its coverage provider must share the same version (the
      # coverage payload format changes between majors), so bump them together.
      vitest:
        patterns:
          - 'vitest'
          - '@vitest/*'
      angular:
        patterns:
          - '@angular/*'
          - '@angular-eslint/*'
        update-types:
          - 'minor'
          - 'patch'
      dependencies:
        patterns:
          - '*'
        exclude-patterns:
          - '@angular/*'
          - '@angular-eslint/*'
        update-types:
          - 'patch'
    # Ensure lock file is always updated
    versioning-strategy: increase
    ignore:
      - dependency-name: '@jsverse/utils'
      # Keep Node types aligned on major 22 to match CI/runtime tooling expectations.
      - dependency-name: '@types/node'
        versions:
          - '>=23'
      # jsdom 30.1 dropped the Blob impl `_buffer` that Vitest 4's jsdom compat
      # shim (makeCompatBlob) reads, so URL.createObjectURL crashes in tests.
      # Unpin once Vitest ships a compatible shim.
      - dependency-name: 'jsdom'
        versions:
          - '>=30.1.0'
